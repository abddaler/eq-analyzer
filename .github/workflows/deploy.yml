name: Deploy to GitHub Pages

# GitHub Pages serves a repository as-is unless something builds it first.
# This workflow runs the build and publishes dist/, so the source index.html
# (which points at /src/main.tsx) never reaches production.

on:
  push:
    branches: [claude/eq-scope-spectrum-analyzer-b12zaf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Cheap insurance: the DSP tests take a few seconds and a broken
      # analyser is worse than no deployment.
      - run: npm run check

      - name: Build
        env:
          # A project site lives at https://<user>.github.io/<repo>/, so every
          # absolute URL in the bundle needs that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Prepare the artifact
        run: |
          # Single-page app: unknown paths should still render the shell.
          cp dist/index.html dist/404.html
          # Stop GitHub from running the output through Jekyll.
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
